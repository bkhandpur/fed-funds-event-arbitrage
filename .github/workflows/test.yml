name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,parquet]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -m 'not live'
      - run: mypy src dashboard scripts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          PYTHON_API_ORIGIN: http://127.0.0.1:8107
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
