[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fomc-basis-monitor"
version = "0.1.0"
description = "Research monitor for Kalshi FOMC contracts and CME Fed Funds futures."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.22",
  "pydantic>=2.7",
  "rich>=13.7",
  "scipy>=1.13",
  "streamlit>=1.35",
  "typer>=0.12",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.2", "pytest-cov>=5", "ruff>=0.5"]
parquet = ["pyarrow>=16"]

[project.scripts]
fomc-basis = "fomc_basis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fomc_basis"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["live: tests that contact external market-data services"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".deps", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
exclude = ["^\\.deps/", "^notebooks/"]
disable_error_code = ["prop-decorator"]
